    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{discord:{bg:'#111214',card:'#0A0B0A',text:'#DBDEE1',muted:'#949BA4',divider:'#1F2023',spotify:'#1ED760',button:'#2B2D31',buttonHover:'#383A40'}}}}}

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #snowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 60px -10px rgba(0, 0, 0, 0.8);
            border-radius: 2rem;
        }

        .title-brush {
            font-family: 'Permanent Marker', cursive;
            text-transform: uppercase;
            line-height: 1;
            background: linear-gradient(to bottom, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 10px 20px rgba(0,0,0,0.5);
        }
        
        .japanese-text {
            font-family: 'Noto Sans JP', sans-serif;
            letter-spacing: 0.2em;
        }

        .logo-font {
            font-family: 'Permanent Marker', cursive;
            letter-spacing: 2px;
        }

        .toxic-font {
            font-family: 'Rubik Glitch', display;
            text-shadow: 0px 0px 20px rgba(255, 255, 255, 0.4), 0px 10px 30px rgba(0, 0, 0, 0.8);
        }

        .bw-filter {
            filter: grayscale(100%) contrast(110%) brightness(90%);
        }

        .character-img {
            position: absolute;
            bottom: 0;
            right: 0;
            height: 115%;
            width: auto;
            max-width: none;
            z-index: 10;
            object-fit: cover;
            object-position: bottom;
            pointer-events: none;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
        }

        .bottom-fog {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            z-index: 5;
            pointer-events: none;
            border-bottom-left-radius: 2rem;
            border-bottom-right-radius: 2rem;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #1A1B1E;
            border-radius: 10px;
        }
        
        .btn-transition {
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn-transition:active {
            transform: translateY(1px);
        }

        .avatar-mask {
            mask-image: radial-gradient(circle 46px at center, black 100%, transparent 100%);
            -webkit-mask-image: -webkit-radial-gradient(circle 46px at center, black 100%, transparent 100%);
        }
        
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
        }
    </style>

                            <div class="w-[50px] h-[50px] md:w-[64px] md:h-[64px] rounded-md overflow-hidden flex-shrink-0 border border-white/5">
                                <img id="track-cover" src="https://i.scdn.co/image/ab67616d0000b27315565d52242d1de82a4df3c5" alt="Album Art" class="w-full h-full object-cover grayscale transition-all duration-300 hover:grayscale-0">
                            </div>
                            <div class="flex flex-col justify-center overflow-hidden w-full">
                                <a href="#" id="track-title" class="text-xs md:text-sm font-bold text-white truncate hover:underline leading-tight mb-0.5">Patrullon</a>
                                <div class="text-[11px] md:text-[13px] text-discord-text truncate">by <a href="#" id="track-artist" class="hover:underline">Tombochio</a></div>
                                <div class="text-[11px] md:text-[13px] text-discord-text truncate">on <a href="#" id="track-album" class="hover:underline">Sencillo</a></div>
                            </div>
                        </div>

                        <div class="w-full mb-4">
                            <div class="h-1 w-full bg-gray-600 rounded-full overflow-hidden relative group cursor-pointer">
                                <div id="progress-bar" class="h-full bg-white rounded-full group-hover:bg-discord-spotify transition-colors" style="width: 0%;"></div>
                                <div id="progress-handle" class="absolute h-2 w-2 md:h-3 md:w-3 bg-white rounded-full top-1/2 -translate-y-1/2 -ml-1 md:-ml-1.5 opacity-0 group-hover:opacity-100 transition-opacity" style="left: 0%;"></div>
                            </div>
                            <div class="flex justify-between text-[10px] md:text-[11px] text-discord-muted mt-1.5 font-medium">
                                <span id="time-current">0:00</span>
                                <span id="time-total">3:56</span>
                            </div>
                        </div>
                    </div>

                    
                            </a>
                        </div>
                    </div>
                    
                </div>
            </div>

        </div>
    </main>

    <script>
        document.oncontextmenu=()=>false;
        document.onkeydown=(e)=>{if(e.keyCode===123||(e.ctrlKey&&e.shiftKey&&(e.keyCode===73||e.keyCode===74||e.keyCode===67))||(e.ctrlKey&&(e.keyCode===85||e.keyCode===83||e.keyCode===80||e.keyCode===67))||(e.metaKey&&e.altKey&&(e.keyCode===73||e.keyCode===74||e.keyCode===85))||(e.metaKey&&(e.keyCode===83||e.keyCode===80||e.keyCode===67)))return false;};
        document.ondragstart=()=>false;
        document.onselectstart=()=>false;

        lucide.createIcons();

        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let flakes = [];
        const maxFlakes = 250; 
        
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Snowflake {
            constructor() {
                this.reset();
                this.y = Math.random() * height; 
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -10;
                this.radius = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.sway = Math.random() * Math.PI * 2;
                this.swaySpeed = Math.random() * 0.02 + 0.01;
            }

            update() {
                this.y += this.speedY;
                this.sway += this.swaySpeed;
                this.x += Math.sin(this.sway) * 0.5 + this.speedX;

                if (this.y > height || this.x > width + 10 || this.x < -10) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < maxFlakes; i++) {
            flakes.push(new Snowflake());
        }

        function animateSnow() {
            ctx.clearRect(0, 0, width, height);
            for (let flake of flakes) {
                flake.update();
                flake.draw();
            }
            requestAnimationFrame(animateSnow);
        }

        animateSnow();

        const introScreen = document.getElementById('intro-screen');
        const mainApp = document.getElementById('main-app');
        const btnEntrar = document.getElementById('btn-entrar');
        
        const cardYuta = document.getElementById('card-yuta');
        const cardChoso = document.getElementById('card-choso');
        const discordCard = document.getElementById('discord-card');
        
        const btnCloseProfile = document.getElementById('btn-close-profile');
        const btnOpenProfile = document.getElementById('btn-open-profile');
        const bgAudio = document.getElementById('bg-audio');

        const playlist = [
            {
                title: "Patrullon",
                artist: "Tombochio",
                album: "Sencillo",
                cover: "https://i.scdn.co/image/ab67616d0000b27315565d52242d1de82a4df3c5",
                src: "patrullon.mp3"
            },
            {
                title: "Vamos Aclarando Muchas Cosas",
                artist: "Codiciado",
                album: "Vamos Aclarando Muchas Cosas",
                cover: "https://i.scdn.co/image/ab67616d0000b273ce92d22c9cd7b7fe094fa791",
                src: "codiciado.mp3"
            }
        ];

        let currentSongIndex = 0;
        let isPlaying = false;

        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const trackAlbum = document.getElementById('track-album');
        const trackCover = document.getElementById('track-cover');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const btnNextSong = document.getElementById('btn-next-song');
        const btnPrevSong = document.getElementById('btn-prev-song');

        function loadSong(index) {
            const song = playlist[index];
            trackTitle.textContent = song.title;
            trackArtist.textContent = song.artist;
            trackAlbum.textContent = song.album;
            trackCover.src = song.cover;
            bgAudio.src = song.src;
            
            progressBar.style.width = '0%';
            progressHandle.style.left = '0%';
            timeCurrentElement.textContent = '0:00';
            timeTotalElement.textContent = '0:00';
        }

        function playSong() {
            isPlaying = true;
            btnPlayPause.innerHTML = '<i data-lucide="pause" class="w-3 h-3 md:w-4 md:h-4"></i>';
            lucide.createIcons();
            bgAudio.play().catch(e => console.log(e));
        }

        function pauseSong() {
            isPlaying = false;
            btnPlayPause.innerHTML = '<i data-lucide="play" class="w-3 h-3 md:w-4 md:h-4"></i>';
            lucide.createIcons();
            bgAudio.pause();
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) playSong();
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) playSong();
        }

        btnPlayPause.addEventListener('click', () => {
            if (isPlaying) pauseSong();
            else playSong();
        });
        btnNextSong.addEventListener('click', nextSong);
        btnPrevSong.addEventListener('click', prevSong);

        bgAudio.addEventListener('ended', nextSong);

        bgAudio.addEventListener('loadedmetadata', () => {
            timeTotalElement.textContent = formatTime(bgAudio.duration);
        });

        const progressBar = document.getElementById('progress-bar');
        const progressHandle = document.getElementById('progress-handle');
        const timeCurrentElement = document.getElementById('time-current');
        const timeTotalElement = document.getElementById('time-total');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        bgAudio.addEventListener('timeupdate', () => {
            const currentTime = bgAudio.currentTime;
            const duration = bgAudio.duration || 1;
            
            const percentage = (currentTime / duration) * 100;
            progressBar.style.width = `${percentage}%`;
            progressHandle.style.left = `${percentage}%`;
            
            timeCurrentElement.textContent = formatTime(currentTime);
        });

        btnEntrar.addEventListener('click', () => {
            bgAudio.volume = 0.5;
            playSong();

            introScreen.style.opacity = '0';
            canvas.classList.remove('opacity-0');
            
            setTimeout(() => {
                introScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                
                void mainApp.offsetWidth; 
                mainApp.style.opacity = '1';

                cardYuta.classList.remove('opacity-0', 'md:-translate-x-20');
                cardChoso.classList.remove('opacity-0', 'md:translate-x-20');
                discordCard.classList.remove('opacity-0', 'scale-75', 'translate-y-12');
                
            }, 1000); 
        });

        btnCloseProfile.addEventListener('click', () => {
            discordCard.style.transitionDelay = '0ms'; 
            discordCard.classList.add('opacity-0', 'scale-[0.8]', 'translate-y-20', 'pointer-events-none', 'blur-sm');
            
            setTimeout(() => {
                btnOpenProfile.classList.remove('opacity-0', 'scale-50', 'pointer-events-none');
            }, 600);
        });

        btnOpenProfile.addEventListener('click', () => {
            btnOpenProfile.classList.add('opacity-0', 'scale-50', 'pointer-events-none');
            
            setTimeout(() => {
                discordCard.classList.remove('opacity-0', 'scale-[0.8]', 'translate-y-20', 'pointer-events-none', 'blur-sm');
                discordCard.classList.remove('scale-75', 'translate-y-12'); 
            }, 400);
        });
    </script>

</body></html>
